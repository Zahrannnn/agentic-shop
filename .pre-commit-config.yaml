# Pre-commit hooks for agentic-shop.
# Install: uv tool install pre-commit && pre-commit install
# Run on everything: uvx pre-commit run --all-files
#
# Ruff config lives in backend/pyproject.toml; ruff discovers it by walking up
# from each file, so backend files are linted/formatted with the project rules.
# Frontend hooks (biome/eslint etc.) land with the frontend phase.

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
        exclude: uv\.lock$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        # Root docs are Windows-authored and git's autocrlf manages them;
        # line-ending churn on protected docs (PRD/DECISIONS) is unwanted.
        exclude: \.md$

  # Lint + format (mirrors the AGENTS.md quality gates)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
