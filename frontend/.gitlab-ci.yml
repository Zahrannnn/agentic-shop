stages:
  - build
  - package

variables:
  DOCKER_TLS_CERTDIR: ""

build_app:
  stage: build
  image: node:22-alpine
  script:
    - npm ci
    - npm run build

build_image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t "$HUB_URL/$APP_NAME:$APP_VERSION" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker login "$HUB_URL" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
        docker push "$HUB_URL/$APP_NAME:$APP_VERSION"
      fi
